name: C++ sanitizers

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitizer:
    name: ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, undefined]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          numpy pybind11 pytest setuptools wheel

      - name: Build extension with sanitizer instrumentation
        env:
          CC: gcc
          CXX: g++
          CXXFLAGS: -O1 -g -fsanitize=${{ matrix.sanitizer }} -fno-omit-frame-pointer
          LDFLAGS: -fsanitize=${{ matrix.sanitizer }}
          MC_DAGPROP_ENABLE_LTO: "0"
          MC_DAGPROP_INSTRUMENTED: "1"
        run: python -m pip install --no-build-isolation --editable ".[plot]"

      - name: Preload AddressSanitizer runtime
        if: matrix.sanitizer == 'address'
        run: >-
          echo "LD_PRELOAD=$(g++ -print-file-name=libasan.so):$(g++ -print-file-name=libstdc++.so.6)"
          >> "$GITHUB_ENV"

      - name: Run test suite under sanitizer
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python -m pytest -q
