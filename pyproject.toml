[project]
name = "mc-dagprop"
version = "1.0.0rc1"
description = "Discrete analytic DAG propagation with Monte Carlo validation backend"
authors = [
    { name = "Florian Flükiger", email = "flfuchs@student.ethz.ch" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]
requires-python = ">=3.12,<3.15"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "numpy>=2.4.0",
]

[project.urls]
Repository = "https://github.com/WonJayne/mc_dagprop"
Documentation = "https://github.com/WonJayne/mc_dagprop/blob/main/docs/semantics.md"
Issues = "https://github.com/WonJayne/mc_dagprop/issues"

[project.optional-dependencies]
plot = ["plotly>=6.0.0"]

[tool.poetry.dependencies]
numpy = "^2.4.0"

[tool.poetry.group.dev.dependencies]
basedpyright = "~1.38.2"
black = "^25.12.0"
build = "^1.3.0"
pytest = "^8.3.5"
pytest-cov = "^7.0.0"
ruff = "0.15.6"
twine = "^6.2.0"

[build-system]
requires = [
    "setuptools>=77,<83",
    "wheel",
    "pybind11>=2.13",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 120
skip-magic-trailing-comma = true
target-version = ["py312", "py313", "py314"]
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | __pycache__
  | _build
  | buck-out
  | build
  | build_venv
  | dist
  | venv
)/
'''

[tool.ruff]
line-length = 120
target-version = "py312"
force-exclude = true
src = ["src", "test", "demo", "scripts"]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
    "C4",
    "PLC0415",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["S101"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "recommended"
include = ["src/mc_dagprop", "typing_tests"]
exclude = ["**/__pycache__", "build", "dist"]
executionEnvironments = [
    { root = ".", extraPaths = ["src"] },
]
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownLambdaType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportMissingTypeStubs = "none"
reportImplicitStringConcatenation = "none"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["test"]
markers = [
    "slow: expensive tests executed only when explicitly requested",
]

[tool.coverage.run]
branch = true
source = ["mc_dagprop"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
include = ["mc_dagprop*"]
where = ["src"]

[tool.setuptools.package-data]
"mc_dagprop" = ["py.typed"]
"mc_dagprop.monte_carlo" = ["*.pyi"]

[tool.setuptools.exclude-package-data]
"mc_dagprop.monte_carlo" = ["*.cpp", "*.hpp"]
